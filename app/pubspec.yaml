name: jaga
description: Scam-call guardian for Malaysian families.
publish_to: none
version: 0.1.0+1

environment:
  # Pinned to the team toolchain (app/.fvmrc). CI reads this exact version.
  sdk: 3.13.5
  flutter: 3.47.7

# Lean on purpose: each lane adds what its ticket needs, in a dependency-only PR.
# pubspec.lock is committed, so everyone resolves identical package versions.
dependencies:
  android_intent_plus: ^6.1.0
  crypto: ^3.0.8
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.3
  permission_handler: ^13.0.2
  proximity_sensor: ^2.0.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  json_schema: ^5.2.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-ExtraBold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-ExtraBold.ttf
          weight: 800
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 600
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 800
