[project]
name = "jaga-server"
version = "0.1.0"
requires-python = "==3.13.*"
# Lean on purpose: each lane adds what its ticket needs, in a dependency-only PR.
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "websockets",  # client for the Muse Voice Transcribe realtime socket (#20)
  "httpx",  # HTTP client for the Muse Spark chat API (#21)
  "firebase-admin",  # FCM client for family alert pushes (#54)
  "pyjwt",  # signs Voice access tokens for the app (#12)
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "jsonschema", "rfc3339-validator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jaga"]
