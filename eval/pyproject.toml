[project]
name = "jaga-eval"
version = "0.1.0"
requires-python = "==3.13.*"
# Imports the real pipeline from jaga-server, so evaluation measures exactly what ships.
dependencies = ["jaga-server"]

[tool.uv.sources]
jaga-server = { workspace = true }

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jaga_eval"]
