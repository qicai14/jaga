name: Deploy server

# Needs the repo secret FLY_API_TOKEN (fly tokens create deploy). Off until that secret exists.
on:
  push:
    branches: [main]
    paths: ["server/**", "uv.lock", "pyproject.toml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-server
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy . --config server/fly.toml --dockerfile server/Dockerfile --remote-only
        if: env.FLY_API_TOKEN != ''
