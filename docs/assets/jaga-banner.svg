<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">JAGA</title>
  <desc id="d">Jaga, the scam-call guardian: it hears what the caller says and warns before the money moves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2e2a"/>
      <stop offset="1" stop-color="#114a42"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bff3e3"/>
    </linearGradient>
  </defs>
  <!-- Own background, so the banner reads the same on GitHub's light and dark themes -->
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <!-- Sound wave that turns into a shield -->
  <g fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M70 150h30M118 120v60M136 95v110M154 130v40M172 110v80M190 140v20"/>
  </g>
  <path d="M260 70l70 26v52c0 46-30 78-70 92-40-14-70-46-70-92V96z" fill="#14b8a6" opacity="0.18"/>
  <path d="M260 70l70 26v52c0 46-30 78-70 92-40-14-70-46-70-92V96z" fill="none" stroke="#5eead4" stroke-width="6" stroke-linejoin="round"/>
  <path d="M232 152l20 20 38-42" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="380" y="190" fill="url(#word)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="18">JAGA</text>
  <text x="384" y="240" fill="#99f6e4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" letter-spacing="1">Hears the scam script. Stops the money.</text>
  <text x="1150" y="60" text-anchor="end" fill="#5eead4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3">JAGA · "TO GUARD" IN MALAY</text>
</svg>
